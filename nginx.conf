# ═══════════════════════════════════════════════════════════════
#  AeroSphere — Nginx Reverse Proxy Configuration
#  Routes all traffic to Tomcat container on port 8080
#  SSL-ready (see commented HTTPS block at bottom)
# ═══════════════════════════════════════════════════════════════

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ────────────────────────────────────────────────
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time';

    access_log  /var/log/nginx/access.log  main;

    # ── Performance ────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    client_max_body_size 10M;

    # ── Gzip Compression ───────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss;

    # ── Security: hide server version ─────────────────────────
    server_tokens off;

    # ── Rate Limiting Zones ────────────────────────────────────
    # Limits login to 5 req/min per IP to prevent brute-force
    limit_req_zone $binary_remote_addr zone=login_zone:10m rate=5r/m;
    # General API limit
    limit_req_zone $binary_remote_addr zone=api_zone:10m   rate=30r/m;

    # ── Upstream: Tomcat App ───────────────────────────────────
    upstream aerosphere_tomcat {
        server app:8080;
        keepalive 32;
    }

    # ══════════════════════════════════════════════════════════
    #  HTTP Server — port 80
    # ══════════════════════════════════════════════════════════
    server {
        listen 80;
        server_name _;

        # ── Global Security Headers ───────────────────────────
        add_header X-Frame-Options           "SAMEORIGIN"                   always;
        add_header X-Content-Type-Options    "nosniff"                      always;
        add_header X-XSS-Protection          "1; mode=block"                always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "geolocation=(), microphone=()"   always;

        # ── Uncomment to force HTTPS ───────────────────────────
        # return 301 https://$host$request_uri;

        # ── Health Check (no rate limiting, no access log) ────
        location = /health {
            proxy_pass         http://aerosphere_tomcat;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            access_log off;
        }

        # ── Login endpoint: rate limited ───────────────────────
        location = /login {
            limit_req zone=login_zone burst=5 nodelay;
            limit_req_status 429;

            proxy_pass         http://aerosphere_tomcat;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_read_timeout 30s;
        }

        # ── Register endpoint: rate limited ───────────────────
        location = /register {
            limit_req zone=login_zone burst=3 nodelay;
            limit_req_status 429;

            proxy_pass         http://aerosphere_tomcat;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_read_timeout 30s;
        }

        # ── Static assets: aggressive caching ─────────────────
        location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass         http://aerosphere_tomcat;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   Connection        "";
            expires            30d;
            add_header         Cache-Control "public, immutable";
            access_log         off;
        }

        # ── Block direct access to sensitive file types ────────
        location ~* \.(sql|xml|properties|bak|log|conf|ini)$ {
            deny all;
            return 404;
        }

        # ── Main Application (catch-all) ───────────────────────
        location / {
            proxy_pass         http://aerosphere_tomcat;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;

            # Buffer settings for large responses (PDF invoices)
            proxy_buffer_size          128k;
            proxy_buffers              4 256k;
            proxy_busy_buffers_size    256k;
        }
    }

    # ══════════════════════════════════════════════════════════
    #  HTTPS Server — port 443 (uncomment after SSL setup)
    #
    #  Setup with Let's Encrypt:
    #    docker run -it --rm -v ./ssl:/etc/letsencrypt \
    #      certbot/certbot certonly --standalone \
    #      -d yourdomain.com --email admin@yourdomain.com --agree-tos
    #
    #  Then mount ssl/live/yourdomain.com/ → /etc/nginx/ssl/
    # ══════════════════════════════════════════════════════════
    # server {
    #     listen 443 ssl http2;
    #     server_name yourdomain.com;
    #
    #     ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    #     ssl_prefer_server_ciphers off;
    #     ssl_session_timeout 1d;
    #     ssl_session_cache   shared:SSL:50m;
    #     ssl_stapling        on;
    #     ssl_stapling_verify on;
    #
    #     add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    #
    #     location / {
    #         proxy_pass         http://aerosphere_tomcat;
    #         proxy_http_version 1.1;
    #         proxy_set_header   Host              $host;
    #         proxy_set_header   X-Real-IP         $remote_addr;
    #         proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    #         proxy_set_header   X-Forwarded-Proto https;
    #         proxy_set_header   Connection        "";
    #         proxy_read_timeout 120s;
    #     }
    # }
}
