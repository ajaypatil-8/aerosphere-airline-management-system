# ═══════════════════════════════════════════════════════════════
#  AeroSphere — Docker Compose (Production)
#  Services: nginx → app (Tomcat) → mysql
#
#  Usage:
#    docker-compose up --build          # first run
#    docker-compose up -d               # detached (subsequent)
#    docker-compose down -v             # stop + remove volumes
# ═══════════════════════════════════════════════════════════════

version: '3.9'

# ── Named Volumes ────────────────────────────────────────────────
volumes:
  mysql_data:
    driver: local
  tomcat_logs:
    driver: local

# ── Network ──────────────────────────────────────────────────────
networks:
  aerosphere_net:
    driver: bridge

services:

  # ──────────────────────────────────────────────────────────────
  #  MySQL 8.0 Database
  # ──────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: aerosphere_mysql
    restart: unless-stopped
    networks:
      - aerosphere_net
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE:      ${MYSQL_DATABASE}
      MYSQL_USER:          ${MYSQL_USER}
      MYSQL_PASSWORD:      ${MYSQL_PASSWORD}
    volumes:
      # Persist database data across restarts
      - mysql_data:/var/lib/mysql
      # Auto-import SQL dump on first start
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "3307:3306"   # Exposed on 3307 to avoid conflicts with local MySQL
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --sql-mode=STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ──────────────────────────────────────────────────────────────
  #  AeroSphere App (Tomcat 9)
  # ──────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aerosphere_app
    restart: unless-stopped
    networks:
      - aerosphere_net
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # Database
      DB_URL:       ${DB_URL}
      DB_USER:      ${DB_USER}
      DB_PASSWORD:  ${DB_PASSWORD}
      # Razorpay
      RAZORPAY_KEY_ID:     ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      # SMTP
      SMTP_HOST:     ${SMTP_HOST}
      SMTP_PORT:     ${SMTP_PORT}
      SMTP_USER:     ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM:     ${SMTP_FROM}
      # SMS
      SMS_API_KEY: ${SMS_API_KEY}
      # App
      APP_NAME:     ${APP_NAME}
      APP_BASE_URL: ${APP_BASE_URL}
      # JVM tuning
      JAVA_OPTS: >-
        -Xms256m
        -Xmx512m
        -XX:+UseG1GC
        -Djava.security.egd=file:/dev/./urandom
    volumes:
      - tomcat_logs:/usr/local/tomcat/logs
    ports:
      - "8080:8080"   # Direct access for debugging; proxied via nginx in prod
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ──────────────────────────────────────────────────────────────
  #  Nginx Reverse Proxy
  # ──────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: aerosphere_nginx
    restart: unless-stopped
    networks:
      - aerosphere_net
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${NGINX_PORT:-80}:80"
      # Uncomment for SSL:
      # - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # Uncomment for SSL certificates:
      # - ./ssl:/etc/nginx/ssl:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
