# ═══════════════════════════════════════════════════════════════
#  AeroSphere — GitHub Actions CI/CD Pipeline
#
#  Triggers : push to main / master
#  Jobs     :
#    1. build  — compile & package WAR with Maven
#    2. deploy — SSH into EC2, pull latest, rebuild Docker
#
#  Required GitHub Secrets:
#    EC2_HOST        — public IP or DNS of your EC2 instance
#    EC2_USER        — SSH username (e.g. ubuntu, ec2-user)
#    EC2_SSH_KEY     — contents of your .pem private key (full text incl. headers)
#    EC2_APP_DIR     — absolute path to repo on EC2 (e.g. /home/ubuntu/aerosphere)
# ═══════════════════════════════════════════════════════════════

name: AeroSphere CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  JAVA_VERSION: '11'

jobs:

  # ─────────────────────────────────────────────────────────────
  #  Job 1: Build & verify WAR
  # ─────────────────────────────────────────────────────────────
  build:
    name: Maven Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build WAR with Maven
        run: mvn clean package -DskipTests -B --no-transfer-progress

      - name: Verify WAR exists
        run: |
          ls -la target/app.war
          echo "WAR size: $(du -sh target/app.war | cut -f1)"

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: aerosphere-war
          path: target/app.war
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  #  Job 2: Deploy to EC2 (only on push, not on PRs)
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to EC2 via SSH
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
        run: |
          ssh -i ~/.ssh/ec2_key.pem \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=30 \
              "${EC2_USER}@${EC2_HOST}" \
              "set -e

              echo '━━━ [1/5] Pulling latest code ━━━'
              cd ${EC2_APP_DIR}
              git fetch origin
              git reset --hard origin/\$(git rev-parse --abbrev-ref HEAD)

              echo '━━━ [2/5] Building new Docker image ━━━'
              docker compose build --no-cache app

              echo '━━━ [3/5] Rolling update (zero-downtime) ━━━'
              docker compose up -d --no-deps app

              echo '━━━ [4/5] Waiting for Tomcat to start ━━━'
              sleep 20

              echo '━━━ [5/5] Health check ━━━'
              for i in 1 2 3; do
                if curl -sf http://localhost:8080/health; then
                  echo '✅ App is healthy'
                  exit 0
                fi
                echo \"Attempt \$i failed — retrying in 10s...\"
                sleep 10
              done

              echo '❌ Health check failed — rolling back'
              docker compose restart app
              exit 1"

      - name: Notify success
        if: success()
        run: |
          echo "✅ AeroSphere deployed successfully to EC2"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"

      - name: Notify failure
        if: failure()
        run: |
          echo "❌ Deployment FAILED for commit ${{ github.sha }}"
          echo "Check the EC2 logs: docker compose logs app"
