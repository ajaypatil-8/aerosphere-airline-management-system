name: AeroSphere CI/CD

on:
  push:
    branches: [ "main", "master" ]

env:
  JAVA_VERSION: '11'

jobs:

  build:
    name: Maven Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'
      - run: mvn clean package -DskipTests -B --no-transfer-progress
      - run: ls -la target/app.war
      - uses: actions/upload-artifact@v4
        with:
          name: aerosphere-war
          path: target/app.war
          retention-days: 7

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
      - name: Deploy
        run: |
          ssh -i ~/.ssh/ec2_key.pem \
              -o StrictHostKeyChecking=no \
              ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
              "cd ${{ secrets.EC2_APP_DIR }} && \
               git fetch origin && \
               git reset --hard origin/main && \
               docker-compose build --no-cache app && \
               docker-compose up -d --no-deps app && \
               sleep 20 && \
               curl -sf http://localhost:8080/health && echo ' Deploy OK!' || echo ' Health check failed'"
