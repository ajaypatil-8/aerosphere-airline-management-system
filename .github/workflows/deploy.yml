# ═══════════════════════════════════════════════════════════════
#  AeroSphere — GitHub Actions CI/CD Pipeline
#
#  Triggers: push to main / pull requests
#  Jobs:
#    1. build   — compile + package WAR with Maven
#    2. docker  — build Docker image, push to Docker Hub
#    3. deploy  — SSH deploy to production server (optional)
#
#  Required GitHub Secrets:
#    DOCKERHUB_USERNAME    — your Docker Hub username
#    DOCKERHUB_TOKEN       — Docker Hub access token
#    DEPLOY_HOST           — production server IP/hostname
#    DEPLOY_USER           — SSH user on production server
#    DEPLOY_SSH_KEY        — private SSH key (PEM format)
#    DB_PASSWORD           — (injected during build verification)
#    RAZORPAY_KEY_ID       — Razorpay key
#    RAZORPAY_KEY_SECRET   — Razorpay secret
# ═══════════════════════════════════════════════════════════════

name: AeroSphere CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  IMAGE_NAME: aerosphere-app
  JAVA_VERSION: '11'

jobs:

  # ─────────────────────────────────────────────────────────────
  #  Job 1: Build & Test
  # ─────────────────────────────────────────────────────────────
  build:
    name: Maven Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build WAR with Maven
        run: mvn clean package -DskipTests -B --no-transfer-progress

      - name: Verify WAR exists
        run: |
          ls -la target/app.war
          echo "WAR size: $(du -sh target/app.war | cut -f1)"

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: aerosphere-war
          path: target/app.war
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  #  Job 2: Docker Build & Push
  # ─────────────────────────────────────────────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build WAR
        run: mvn clean package -DskipTests -B --no-transfer-progress

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

